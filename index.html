<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NMTI 牛马人格测试</title>
  <meta name="description" content="NMTI 4轴组合版：投入、生存、信念、表达四轴组合出16种牛马人格。">
  <meta name="theme-color" content="#0d0f12" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta property="og:title" content="NMTI 牛马人格测试">
  <meta property="og:description" content="4轴组合，16种人格，30道职场情境题，测测你是哪种牛马。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://caiheee.github.io/NMTI/">
  <meta property="og:image" content="https://caiheee.github.io/NMTI/img/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="img/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="img/favicon-128.png">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('nmti-theme'); } catch (e) {}
      if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=1794381960">
</head>
<body>
  <button id="theme-toggle" onclick="toggleTheme()" aria-label="切换主题">
    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.8 6.8 0 0 0 9.8 9.8Z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M4.2 12H2M22 12h-2.2M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/></svg>
  </button>

  <div id="loading" class="loading-overlay hidden" role="status" aria-live="polite">
    <div class="loading-spinner"><img src="img/raw.webp" alt="" style="width:60px;height:60px;border-radius:50%;object-fit:cover;"></div>
    <div class="loading-text">正在生成你的四轴人格...</div>
    <div class="loading-dots"><span></span><span></span><span></span></div>
  </div>

  <div id="page-landing" class="page active landing">
    <main class="landing-shell">
      <section class="landing-hero" aria-labelledby="landing-title">
        <div class="hero-copy">
          <div class="landing-icon"><img src="img/raw.webp" alt="NMTI" style="width:80px;height:80px;border-radius:50%;object-fit:cover;"></div>
          <div class="hero-kicker">NMTI · 牛马人格测试</div>
          <h1 id="landing-title">牛马人格测试</h1>
          <div class="hero-actions">
            <button class="btn-primary" onclick="startTest()">开始测试</button>
            <button class="btn-secondary" onclick="scrollToTypes()">查看类型</button>
          </div>
          <div class="stats-row">
            <div class="stat-item"><div class="stat-num">4</div><div class="stat-label">评测轴</div></div>
            <div class="stat-item"><div class="stat-num">16</div><div class="stat-label">人格组合</div></div>
            <div class="stat-item"><div class="stat-num">30</div><div class="stat-label">情境题</div></div>
            <div class="stat-item"><div class="stat-num">3min</div><div class="stat-label">约用时</div></div>
          </div>
        </div>
        <div class="hero-side">
          <div class="axis-panel">
            <h2>四个轴</h2>
            <ul class="axis-list">
              <li class="axis-row">
                <span class="axis-key">🔥 投入</span>
                <span class="axis-pole">卷型</span>
                <span class="axis-bar" aria-hidden="true"></span>
                <span class="axis-pole axis-pole-end">躺型</span>
              </li>
              <li class="axis-row">
                <span class="axis-key">🧰 生存</span>
                <span class="axis-pole">工型</span>
                <span class="axis-bar" aria-hidden="true"></span>
                <span class="axis-pole axis-pole-end">鱼型</span>
              </li>
              <li class="axis-row">
                <span class="axis-key">🥞 信念</span>
                <span class="axis-pole">饼型</span>
                <span class="axis-bar" aria-hidden="true"></span>
                <span class="axis-pole axis-pole-end">醒型</span>
              </li>
              <li class="axis-row">
                <span class="axis-key">🗣️ 表达</span>
                <span class="axis-pole">锅型</span>
                <span class="axis-bar" aria-hidden="true"></span>
                <span class="axis-pole axis-pole-end">嘴型</span>
              </li>
            </ul>
          </div>
        </div>
      </section>

      <section class="gallery-section">
        <h2>16种组合人格</h2>
                <div id="types-drawer" class="types-drawer is-collapsed">
          <div id="types-grid" class="types-grid"></div>
        </div>
        <div class="types-drawer-actions">
          <button id="types-toggle" class="drawer-toggle" type="button" onclick="toggleTypesDrawer()" aria-expanded="false">
            展开 ▾
          </button>
        </div>
      </section>

    </main>
  </div>

  <div id="page-test" class="page test-page">
    <div class="page-topbar">
      <button type="button" class="topbar-btn" onclick="goHome()">主页</button>
      <div class="topbar-title">
        <strong>答题</strong>
      </div>
      <span id="progress-count" class="topbar-count" aria-live="polite"></span>
    </div>
    <div class="progress-bar">
      <div id="progress-fill" class="progress-fill" style="width:0%"></div>
    </div>
    <div id="test-content"></div>
  </div>

  <div id="page-type" class="page result-page">
    <div class="page-topbar">
      <button type="button" class="topbar-btn" onclick="goHome()">主页</button>
      <div class="topbar-title">
        <strong>人格详情</strong>
      </div>
    </div>
    <div id="type-detail"></div>
  </div>

  <div id="page-result" class="page result-page">
    <div class="page-topbar">
      <button type="button" class="topbar-btn" onclick="goHome()">主页</button>
      <div class="topbar-title">
        <strong>评估结果</strong>
      </div>
    </div>
    <div id="result-hero" class="result-hero"></div>
    <div id="result-desc" class="result-card"></div>
    <div id="result-workplace" class="result-card"></div>
    <div id="result-pros-cons" class="result-card"></div>
    <div class="result-row">
      <div id="result-growth" class="result-card"></div>
      <div id="result-compat" class="result-card"></div>
    </div>
    <div class="result-grid">
      <div class="result-card">
        <h3>📊 四轴雷达图</h3>
        <div class="radar-container"><canvas id="radarChart" role="img" aria-label="四轴雷达图"></canvas></div>
      </div>
      <div class="result-card">
        <h3>📈 四轴详情</h3>
        <div id="dimension-bars"></div>
      </div>
    </div>
    <div class="result-card">
      <h3>🏆 相近人格 Top3</h3>
      <div id="combo-type"></div>
    </div>
  </div>

  <script src="js/data.js?v=1794381960"></script>
  <script src="js/app.js?v=1794381960"></script>
</body>
</html>
